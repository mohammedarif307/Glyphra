# ─────────────────────────────────────────────
# render.yaml — Render deployment configuration
# Handles backend auto-deploy settings
# ─────────────────────────────────────────────

services:
  - type: web
    name: glyphra-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROK_API_KEY
        sync: false        # You set this manually in Render dashboard
      - key: CLIENT_URL
        value: https://glyphra.netlify.app
      - key: PORT
        value: 5000
