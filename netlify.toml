# ─────────────────────────────────────────────
# netlify.toml — Netlify deployment config
# Handles frontend build + SPA routing
# ─────────────────────────────────────────────

[build]
  base    = "client"
  command = "npm run build"
  publish = "dist"

# SPA routing — send all routes to index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "https://glyphra-api.onrender.com"
